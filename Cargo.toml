[package]
name = "bracebalance"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[[bin]]
name = "bracebalance"
path = "src/main.rs"

[[bin]]
name = "bracebalance-mcp-server"
path = "src/bin/bracebalance-mcp-server.rs"

[dependencies]
clap       = { version = "4.5.60", features = ["derive"] }
rmcp       = { version = "=3.1.4", features = ["server", "transport-io", "macros"] }
schemars   = "0.8"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio      = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow     = "1.0"
nom = "8.0.0"
