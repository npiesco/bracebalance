[package]
name = "bracebalance"
version = "0.1.0"
edition = "2024"

[dependencies]
clap       = { version = "4.5.60", features = ["derive"] }
rmcp       = { version = "0.16.0", features = ["server", "transport-io", "macros"] }
schemars   = "1.2.1"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio      = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow     = "1.0"
